<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" type="text/javascript" defer></script>
</head>
<body>
  <main class="page">
    <h1>Wortpaar hinzufügen</h1>
    <form id="word-pair-form">
      <label for="english-word">English</label>
      <input id="english-word" name="english" type="text" required>

      <label for="german-word">Deutsch</label>
      <input id="german-word" name="german" type="text" required>

      <button type="submit">OK</button>
    </form>

    <p id="storage-error" class="storage-error" role="alert" hidden></p>

    <section class="word-pairs-section">
      <h2>Wortpaare</h2>
      <p id="empty-list-message">Noch keine Wortpaare hinzugefügt.</p>
      <ul id="word-pair-list"></ul>
    </section>
  </main>
</body>
</html>
